name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend/app backend/browser
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p 'test_*.py'

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-validation-only
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Check shell script syntax
        run: bash -n deploy.sh scripts/preflight.sh scripts/backup-data.sh

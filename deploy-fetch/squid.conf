http_port 3128

acl fetch_client src 172.30.50.10/32
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl blocked_dst dst 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl blocked_ipv6 dst ::/0

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked_dst
http_access deny blocked_ipv6
http_access allow fetch_client
http_access deny all

cache deny all
access_log none
cache_log /dev/null
pinger_enable off
forwarded_for delete
httpd_suppress_version_string on

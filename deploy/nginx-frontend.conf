# ============================================================
#  rag-frontend —— 前端静态站点 + API 反向代理
#
#  由 docker-compose.yml 的 frontend 服务只读挂载到
#  /etc/nginx/conf.d/default.conf。运行时修改此文件后，执行：
#      docker compose exec frontend nginx -s reload
#  即可生效，无需重启容器。
#
#  基础镜像是 nginx-unprivileged：以 uid 101 运行，因此
#    - 只能监听 >=1024 的端口（故用 8080）；
#    - 不能写 /var/run，pid 与临时目录已由镜像改到 /tmp 下。
# ============================================================

server {
    listen 8080;
    server_name _;

    # 前端产物目录，来自宿主机 ./frontend（只读挂载）
    root /usr/share/nginx/html;
    index index.html;

    # 上传接口要能过 nginx。与后端 MAX_UPLOAD_MB 保持一致；
    # 若在 .env 里调大了后端上限而忘了这里，会得到 413 且看不出是哪一层拒的，
    # 所以这里刻意写明它必须与后端同步。
    client_max_body_size 50m;

    # ★ 后端地址必须用「变量 + resolver」的写法，不能写死 proxy_pass http://api:8000。
    #
    # 原因：写死的话，nginx 只在【启动那一刻】把 api 解析成 IP 并永久记住。
    # 而 api 容器一旦被重建（docker compose up -d 换镜像、改环境变量都会重建），
    # 它会拿到一个新 IP —— nginx 却还在往旧 IP 打，表现为 502 bad gateway，
    # 且重启 api 怎么都不好，只有重启 nginx 才行。这类问题非常难排查。
    #
    # 用变量后 nginx 会在每次请求时重新解析，配合下面的 resolver 就是
    # 每次最多缓存 10 秒。127.0.0.11 是 Docker 内嵌 DNS，只在 compose 网络里可用。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # ---------- 前端页面 ----------
    location = / {
        # 入口页禁止缓存：前端升级后用户不该还看到旧版本。
        # 无构建哈希的项目无法靠长缓存 + 文件名区分版本，只能不缓存。
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 静态资源 ----------
    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        # 图片/字体变动少，给一天缓存即可；同样因为没有内容哈希，不宜更长。
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ---------- API 反向代理 ----------
    # 注意 proxy_pass 用变量时必须显式带上 $request_uri：
    # 变量写法下 nginx 不会自动补上「去掉 location 前缀后的剩余路径」，
    # 只会把变量本身当作完整上游地址，结果就是所有 /api/* 都被打到 "/" 上。
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ SSE 流式问答的关键：必须关掉响应缓冲。
        # nginx 默认会把上游响应攒进缓冲区再整块发出，逐字输出会被攒成
        # 一大坨一次性吐出，前端会全程「无输出」然后突然出现整段答案。
        proxy_buffering off;
        proxy_cache off;
        # 关闭分块编码转换，SSE 需要原样透传
        chunked_transfer_encoding on;

        # 入库要串行调 120 次 embedding，耗时可达 1~3 分钟，
        # 默认 60s 会在后端还在干活时就把连接掐断。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 后端自有路径 ----------
    location = /health {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        access_log off;
    }

    location /docs {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# ============================================================
#  rag-frontend —— 前端静态站点 + API 反向代理
#
#  由 docker-compose.yml 的 frontend 服务只读挂载到
#  /etc/nginx/conf.d/default.conf。运行时修改此文件后，执行：
#      docker compose exec frontend nginx -s reload
#  即可生效，无需重启容器、更不需要重建镜像。
#
#  基础镜像是 nginx-unprivileged：以 uid 101 运行，因此
#    - 只能监听 >=1024 的端口（故用 8080）；
#    - 不能写 /var/run，pid 与临时目录已由镜像改到 /tmp 下。
#
#  站点根目录的内容（Vue 构建产物）来自镜像构建阶段，
#  定义在 frontend/Dockerfile 的 `COPY --from=build /app/dist ...`。
#  ★ 与上一版的关键差异：产物不再从宿主机挂载。
#    多阶段构建把 dist 打进镜像后，nginx 没有任何对宿主机的依赖，
#    容器自带完整站点 —— 镜像到哪都能跑，也不会出现
#    「宿主机目录忘了挂/挂错路径 → 站点空白」这类问题。
# ============================================================

server {
    listen 8080;
    server_name _;

    # Vue 构建产物目录，已在镜像构建阶段写入
    root /usr/share/nginx/html;
    index index.html;

    # 上传接口要能过 nginx。与后端 MAX_UPLOAD_MB 保持一致；
    # 若在 .env 里调大了后端上限而忘了这里，会得到 413 且看不出是哪一层拒的，
    # 所以这里刻意写明它必须与后端同步。
    # （上传请求经下面的 /api/ 反代打到后端，体积限制在 nginx 这一层先生效。）
    client_max_body_size 50m;

    # ★ 后端地址必须用「变量 + resolver」的写法，不能写死 proxy_pass http://api:8000。
    #
    # 原因：写死的话，nginx 只在【启动那一刻】把 api 解析成 IP 并永久记住。
    # 而 api 容器一旦被重建（docker compose up -d 换镜像、改环境变量都会重建），
    # 它会拿到一个新 IP —— nginx 却还在往旧 IP 打，表现为 502 bad gateway，
    # 且重启 api 怎么都不好，只有重启 nginx 才行。这类问题非常难排查。
    #
    # 用变量后 nginx 会在每次请求时重新解析，配合下面的 resolver 就是
    # 每次最多缓存 10 秒。127.0.0.11 是 Docker 内嵌 DNS，只在 compose 网络里可用。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # ---------- 入口页：绝不缓存 ----------
    # 入口页文件名固定（index.html），无法靠文件名区分版本。
    # 一旦被缓存，前端升级后用户还会长时间看到旧版页面 ——
    # 而旧页面对应的 JS 文件（带哈希）可能已经被删掉，直接白屏。
    # 所以它必须每次都回来问一次；真正的静态资源靠下面的哈希缓存兜住性能。
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---------- 构建产物：可以放心长缓存 ----------
    # Vite 会把 JS/CSS 输出到 /assets/ 且文件名含内容哈希
    # （例如 index-Bx3k2mQp.js）。内容变则文件名变，因此同名文件
    # 的内容永不改变，缓存一年完全安全 —— 这是「不该缓存的入口页 +
    # 可以无限缓存的内容寻址资源」这套标准的落地。
    # immutable 让浏览器在用户按刷新时也不去发条件请求。
    #
    # 注意用 =404：这些是精确的静态文件，找不到就该明确 404。
    # 若沿用 SPA 的 /index.html 回退，请求一个不存在的 .js 会返回 HTML，
    # 浏览器报 “Unexpected token '<'”，排查半天才能发现是 404 伪装成 200。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---------- 其余路径 ----------
    # 主要是 favicon、robots 之类；保留 SPA 回退以防将来加了前端路由。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 图片/字体：文件名一般不带哈希，给一天即可，不宜更长。
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ---------- API 反向代理 ----------
    # 注意 proxy_pass 用变量时必须显式带上 $request_uri：
    # 变量写法下 nginx 不会自动补上「去掉 location 前缀后的剩余路径」，
    # 只会把变量本身当作完整上游地址，结果就是所有 /api/* 都被打到 "/" 上。
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ SSE 流式问答的关键：必须关掉响应缓冲。
        # nginx 默认会把上游响应攒进缓冲区再整块发出，逐字输出会被攒成
        # 一大坨一次性吐出，前端会全程「无输出」然后突然出现整段答案。
        proxy_buffering off;
        proxy_cache off;
        # 关闭分块编码转换，SSE 需要原样透传
        chunked_transfer_encoding on;

        # 入库要串行调 120 次 embedding，耗时可达 1~3 分钟，
        # 默认 60s 会在后端还在干活时就把连接掐断。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 后端自有路径 ----------
    # 前端健康状态面板会轮询 /health，必须一并代理，
    # 否则浏览器会拿到本站的 index.html（HTTP 200 + HTML），
    # JSON 解析失败被当成「无法连接」—— 后端明明是好的。
    location = /health {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        access_log off;
    }

    location /docs {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    # ---------- 压缩 ----------
    # 构建产物里的 JS/CSS 是文本，gzip 后体积通常降到 1/3 左右。
    # 注意 gzip_types 里没有 text/html —— 它默认就已开启，不必也不该重复写。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

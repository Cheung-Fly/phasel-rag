# ============================================================
#  阶段一 RAG 服务 — Azure Standard_B2as_v2 专用编排
#  目标机：2 vCPU / 8 GiB RAM（AMD EPYC 7763，CPU 基线 40%，累积 48 credits/小时）
#
#  两条硬约束（2026-10-07 按实况重定）：
#   1) 机型已由 B2ts_v2(2 vCPU / 1 GiB) 升级为 B2as_v2(2 vCPU / 8 GiB)
#      → 容器内存上限同步放宽到 4 GiB，避免大文档/并发被无谓 OOM Kill
#   2) CPU 基线由 20% 提升到 40%，但仍非无限 → 依旧禁止无谓的 CPU 空转
# ============================================================

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: phase1-rag-api:0.1.0
    container_name: rag-api
    restart: unless-stopped
    # 以宿主机用户身份运行，保证 ./data 下的文件属主一致、可读写。
    # 为什么必须指定：/home/azureuser 权限是 750，容器若以镜像内的
    # appuser(10001) 运行，连这个目录都穿越不进去，bind mount 会 Permission denied。
    # 为什么用 COMPOSE_USER 而不是 UID/GID：bash 里 UID 是只读变量，
    # 脚本无法 export 它，所以统一用一个自定义变量传 "uid:gid"。
    user: "${COMPOSE_USER:-1000:1000}"
    env_file:
      - .env
    ports:
      # 只监听本机，公网入口交给 SSH 隧道 / Nginx。
      # 直接暴露 0.0.0.0 等于把 API Key 挂到公网上。
      - "127.0.0.1:8000:8000"
    volumes:
      # 持久化目录：容器重建不丢知识库
      - ./data/chroma:/app/data/chroma
      - ./data/uploads:/app/data/uploads
    # ---- 内存护栏（2026-10-07 按 8 GiB 实况重定）----
    # 原值 600m / 1600m 是 1 GiB 机型时代的"保命配置"：系统常驻约 250MB，
    # 只剩 600MB 给业务，稍大的 PDF 解析或并发问答就会被 OOM Kill（exit 137）。
    # 现在给业务 4 GiB（约占机器一半），swap 仅作极端兜底；
    # swappiness 已由 60 下调到 10，避免热页被换出后检索延迟抖动。
    mem_limit: 4g
    memswap_limit: 5g
    environment:
      - PYTHONUNBUFFERED=1
      # 2 vCPU → 给 2 线程；在 2 vCPU 上超配线程只会增加上下文切换开销
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - TOKENIZERS_PARALLELISM=false
      # HTTP 层护栏：跨域白名单（留空=仅同源）；单文件上传上限(MB)
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

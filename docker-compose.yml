# ============================================================
#  阶段一 RAG 服务 — Azure Standard_B2as_v2 专用编排
#  目标机：2 vCPU / 8 GiB RAM（AMD EPYC 7763，CPU 基线 40%，累积 48 credits/小时）
#
#  【2026-10-07 架构调整二：单容器 → 四容器】
#  此前是「单容器 + 嵌入式 Chroma」，那是 1 GiB 机型的产物。机型升到 8 GiB 后，
#  它的两个硬伤开始显现：
#    1) 向量索引与 API 抢同一份内存，且无法单独限额 —— 文档一多，API 内存跟着涨；
#    2) 单进程持有 sqlite，多开 worker 就会写冲突，等于把并发能力永久锁死在 1。
#  现拆成 api / chroma / redis / postgres 四个容器，各自独立限额与生命周期。
#
#  【2026-10-07 架构调整三：前端从 api 镜像里剥离】
#  前端原先由 COPY 打进 api 镜像，改一行 CSS 也要重建镜像，且容易出现
#  「改了没生效」（跑的是旧层）。
#
#  【2026-10-07 架构调整四：前端服务默认常驻】
#  frontend 起初挂在 profiles: ["nginx"] 下（可选启用）。实践下来这个「可选」
#  是多余的：它是唯一的访问入口，忘了带 --profile 就整个站点不可用，
#  而 compose 对此既不报错也不提示，只是静默地少起一个容器。
#
#  【2026-10-07 架构调整五：前端迁到 Vue3 + Vite，前后端彻底分家】
#  上一步只把前端「搬出镜像」，但它仍是一堆手写的 .js 直接挂载目录 ——
#  没有构建步骤，也就没有压缩、没有内容哈希、没有模块化。本次改为：
#    - frontend/ 是一个独立的 Vue3 + Vite 工程，有自己的 package.json；
#    - frontend 服务改为 build（多阶段：node 构建 → nginx 托管 dist），
#      产物打在镜像里，不再挂载宿主机目录；
#    - api 服务不再挂载 ./frontend，也不再挂载 /ui —— 它退化成纯接口服务。
#  于是两个进程真正独立：改前端不碰 API 镜像，API 升级不影响页面能否打开，
#  哪怕 API 挂了，nginx 仍能正常发出页面（前端会显示「无法连接」）。
#
#  开发与生产现在是两套不同形态，这是选择构建链的必然结果：
#    - 开发：cd frontend && npm run dev  → Vite 5173（HMR），/api 代理到 8000
#    - 生产：docker compose up -d --build frontend → nginx 8080 托管 dist
#  宿主机上改前端源码对容器**不再即时生效**，必须重建镜像。
#
#  内存预算（总 7.7 GiB，系统常驻约 0.9 GiB）：
#      api 2g + chroma 1.5g + postgres 1g + redis 512m + frontend 128m = 5.125 GiB
#      留约 1.7 GiB 余量给系统与突发，正常不会触发 swap。
#      注意 limit 是「上限」不是「预留」，实际常驻远低于此
#      （frontend 纯静态 + 反代，实测常驻仅 6-10 MiB）。
#      注意：frontend 的**构建阶段**是临时的，不在这份预算里 ——
#      它只在 docker build 期间存在，峰值约 300-500 MiB，构建完即释放。
#
#  CPU：仍是 2 vCPU / 40% 基线。五容器空闲时几乎不吃 CPU，
#       但依旧禁止任何容器无谓空转（空转同样消耗 credit）。
#       vite build 是一次性的几十秒 CPU 峰值，可接受。
# ============================================================

services:
  # ------------------------------------------------------------ 应用
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: phase1-rag-api:0.1.0
    container_name: rag-api
    restart: unless-stopped
    # 以宿主机用户身份运行，保证 ./data 下的文件属主一致、可读写。
    # 为什么必须指定：/home/azureuser 权限是 750，容器若以镜像内的
    # appuser(10001) 运行，连这个目录都穿越不进去，bind mount 会 Permission denied。
    # 为什么用 COMPOSE_USER 而不是 UID/GID：bash 里 UID 是只读变量，
    # 脚本无法 export 它，所以统一用一个自定义变量传 "uid:gid"。
    user: "${COMPOSE_USER:-1000:1000}"
    env_file:
      - .env
    ports:
      # 只监听本机，公网入口交给 SSH 隧道 / Nginx。
      # 直接暴露 0.0.0.0 等于把 API Key 挂到公网上。
      - "127.0.0.1:8000:8000"
    volumes:
      # 只挂上传目录。向量数据已迁到 chroma 容器（见 ./data/chroma-server），
      # API 不再接触 chroma 文件 —— 职责边界更清楚，也避免两边同时写一份数据。
      - ./data/uploads:/app/data/uploads
      # ★ 2026-10-07 调整五删掉了这里原有的 ./frontend:/app/frontend:ro。
      #   API 已不再托管任何前端（main.py 里的 /ui 挂载与 StaticFiles 一并移除），
      #   继续挂一份前端文件进来只会让后来者以为「这里还有一条前端通路」。
      #   保留下来的写权限也少一条 —— 少一个可写路径就少一条被篡改的入口。
    depends_on:
      chroma:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # ---- 内存护栏 ----
    # 由 4g 下调到 2g：向量索引（原先最占内存的部分）已迁出本进程，
    # 现在这里只剩 FastAPI + 文件解析，2 GiB 有充足余量；
    # 省下的内存分给 chroma / postgres。
    mem_limit: 2g
    memswap_limit: 2560m
    environment:
      - PYTHONUNBUFFERED=1
      # 2 vCPU → 给 2 线程；在 2 vCPU 上超配线程只会增加上下文切换开销
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - TOKENIZERS_PARALLELISM=false
      # HTTP 层护栏：跨域白名单（留空=仅同源）；单文件上传上限(MB)
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
      # 入库护栏：真正卡住工作量的是切片数，不是文件体积（见 config.py 注释）
      - INGEST_MAX_CHARS=${INGEST_MAX_CHARS:-2000000}
      - INGEST_MAX_CHUNKS=${INGEST_MAX_CHUNKS:-1200}
      - INGEST_MAX_CONCURRENT=${INGEST_MAX_CONCURRENT:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------ 向量库
  chroma:
    # 版本必须与 API 镜像里的 chromadb 客户端库严格一致（当前 1.5.9）。
    # Chroma 1.x 要求客户端与服务端主版本匹配，错配会直接抛 API 版本错误。
    image: chromadb/chroma:1.5.9
    container_name: rag-chroma
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      # 匿名遥测：关掉。既省一次外网请求，也不把使用数据送出去。
      - ANONYMIZED_TELEMETRY=FALSE
      - PERSIST_DIRECTORY=/data
    volumes:
      # 由旧目录 ./data/chroma 迁移而来（保留了原 sqlite 与 HNSW 索引文件）。
      # 旧目录继续留在原地当冷备份，不删。
      - ./data/chroma-server:/data
    ports:
      # 只映射到本机便于调试；容器间通信走 compose 内网，不依赖这个映射。
      - "127.0.0.1:8001:8000"
    mem_limit: 1500m
    memswap_limit: 2g
    healthcheck:
      # Chroma 1.x 的心跳端点是 /api/v2/heartbeat（0.5.x 的 /api/v1 现在返回 410）。
      # ★ 该官方镜像非常精简：没有 curl / wget / python / nc，常规 HTTP 客户端都用不了，
      #   但自带 bash —— 所以用 bash 的 /dev/tcp 直接发一个 HTTP/1.0 请求，
      #   再校验状态行里含 "200"。
      #   为什么不止探端口：进程活着但内部异常时端口照样 LISTEN，探端口会漏报。
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf "GET /api/v2/heartbeat HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------ 会话热缓存
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    # 只作热缓存，所以用 allkeys-lru + 上限：缓存写满时自动淘汰最久未用的会话，
    # 不会像默认的 noeviction 那样在写满时直接报错。
    # 淘汰在这里是无损的 —— 真相源在 PostgreSQL，缓存随时可以丢。
    # AOF 仍开启：缓存虽可丢，但有它就能在 PG 短暂不可用时也不掉数据。
    # 未设 requirepass：端口只绑 127.0.0.1，且 compose 内网对外隔离。
    # 若将来把端口暴露到内网其他机器，必须补上 requirepass 并同步改 REDIS_URL。
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "300 100"
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 512m
    memswap_limit: 640m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------ 会话存档（真相源）
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ragdb}
      - POSTGRES_USER=${POSTGRES_USER:-rag}
      # 密码从 .env 读；:? 表示"没设置就直接让 compose 报错停住"，
      # 避免用一个空/默认密码悄悄把库跑起来。
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中设置}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      # 只绑本机。日常无需连接；要用 psql 进去看数据时走 127.0.0.1:5432。
      - "127.0.0.1:5432:5432"
    # 单用户场景把资源收窄：默认 max_connections=100 会预留大量内存，
    # shared_buffers 默认只有 128MB 也偏小 —— 一收一放更贴合本机负载。
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
    mem_limit: 1g
    memswap_limit: 1280m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rag} -d $${POSTGRES_DB:-ragdb}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------ 前端（Vue3 构建产物 + nginx）
  # 启动/停止方式与其他服务完全一致，不再需要 --profile：
  #     全部起：          docker compose up -d
  #     只起前端：        docker compose up -d frontend
  #     改完前端后重建：  docker compose up -d --build frontend
  #     停前端：          docker compose stop frontend
  #     改完 nginx 热载：  docker compose exec frontend nginx -s reload
  #
  # 为什么它必须常驻：这是唯一的正式访问入口（127.0.0.1:8080，公网经 SSH 隧道）。
  # 早先把它放进 profile 当「可选服务」，结果是不带 --profile 就起不来，
  # 而 compose 对此不报错、只是静默少起一个容器 —— 省下的 6 MiB 内存，
  # 远远抵不上一次「站点打不开但容器看着都正常」的排查成本。
  #
  # ★ 为什么改成 build 而不是挂载 ./frontend：
  #   Vue 工程必须经过构建（编译 .vue、打依赖、压缩、加内容哈希）才能上线，
  #   挂载源码目录毫无意义 —— 浏览器不认识 .vue，也解析不了裸 import。
  #   构建放在镜像的多阶段里完成（见 frontend/Dockerfile），好处是宿主机
  #   不需要装 Node，构建环境随镜像版本化，换台机器结果一致。
  #   代价必须记住：改前端源码后宿主机文件不再即时生效，必须重建镜像。
  #   开发期的即时反馈改由 Vite dev server（npm run dev）承担。
  #
  # 它提供什么：
  #   1) 静态产物独立于 API 发布（改前端只重建 frontend 镜像，不动 api）；
  #   2) nginx 这层能力 —— gzip、静态缓存头、将来在这台机器上终止 TLS；
  #   3) 前端与后端互为隔离：页面打不开不等于 API 挂了，反之亦然。
  #
  # 与 api 的关系：只通过 /api、/health 反向代理通信，没有任何共享文件。
  # ★ 注意与调整四的区别：api 侧 /ui 兜底入口已随本次调整一并取消。
  #   前端出问题时直接看 frontend 容器日志和 8080 的实际响应；
  #   「8000 能不能出页面」不再是有效的对照手段 —— 那已是两个独立系统。
  #
  # 为什么用 nginx-unprivileged 而不是 nginx:alpine：
  # 官方 nginx 镜像以 root 启动 master 进程（为了绑 80 端口、写 /var/run），
  # 与本机「容器一律非 root」的约定冲突。unprivileged 变体以 uid 101 运行、
  # 默认监听 8080，无需任何额外权限即可工作。
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # 显式命名并带版本号：docker images 里一眼能认出来，
    # 也让「回滚到上一版前端」变成给 compose 改个 tag 这么简单。
    image: phase1-rag-frontend:0.1.0
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      # 与 api 一样只绑本机：公网入口依旧交给 SSH 隧道。
      - "127.0.0.1:8080:8080"
    volumes:
      # ★ 唯一保留的挂载：站点配置。
      #   调缓存头、加一段 location 只需改文件 + nginx -s reload，
      #   不必为了改一行 nginx 配置而重建整个前端镜像。
      #   前端构建产物则已打进镜像 —— 它属于某个版本，不该被本地文件覆盖。
      - ./deploy/nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    # 纯静态 + 反代，128m 非常宽裕（实测常驻约 6-10 MiB）
    mem_limit: 128m
    memswap_limit: 192m
    healthcheck:
      # alpine 基础镜像自带 busybox wget，直接发一个真实 HTTP 请求，
      # 比探端口可靠：nginx 进程活着但配置写坏时，端口照样在听。
      # 额外意义：这同时验证了「镜像里真的有构建产物」——
      # 若 Dockerfile 的 COPY --from 写错路径，这里会立刻变成 unhealthy。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

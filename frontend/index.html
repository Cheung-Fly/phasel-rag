<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私有知识库问答</title>

  <!-- ============================================================
       主题预设脚本 —— 必须内联、必须在任何渲染之前执行。
       ------------------------------------------------------------
       Vue 应用是有挂载成本的（要下载并执行 JS），如果等 main.js 起来
       才设置 data-theme，深色偏好的用户会先看到一帧浅色背景再跳变，
       这个闪烁在整页配色差异大的时候非常刺眼。

       所以这里用一段极短的同步脚本，在 HTML 解析到这一行时就把主题
       打到 <html> 上。CSS 变量立即生效，首帧颜色就是对的。

       为什么用 try 包住：localStorage 在隐私模式/禁用 Cookie 时
       会直接抛异常，不接住的话整页白屏 —— 主题偏好丢了无所谓，
       页面打不开是大事。
       ============================================================ -->
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('rag.theme'));
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) { /* 忽略：拿不到偏好就用系统默认 */ }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
